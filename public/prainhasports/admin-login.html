<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>Login de Administrador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        h2 {
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
            border-radius: 20px;
        }
        input {
            margin-bottom: 10px;
            padding: 10px;
            font-size: 16px;
            border-radius: 20px;
            border: 1px solid #ccc;
        }
        input.invalid {
            border: 1px solid red;
        }
        button {
            padding: 10px;
            font-size: 16px;
            background-color: #ff0000;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: #910303;
        }
        #error-message {
            color: red;
            margin-top: 10px;
        }
        .logoLogin {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            margin-bottom: 15px;
            margin-left: auto;
            margin-right: auto;
        }
        .logoCountainer {
            padding: 20px;
        }
        #logout-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 15px;
            background-color: #d80101;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
        }
        #logout-btn:hover {
            background-color: #9b0000;
        }

        /* Estilo para o ícone do olho */
        .eye-icon {
            position: absolute;
            right: 10px;
            top: 70%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
        }

        .eye-icon:hover {
            color: #333;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .btn-custom-red {
            background-color: #af0e09;
            color: white;
            border: none;
            font-weight: bold;
            font-size: medium;
        }

        .btn-custom-red:hover {
            background-color: #790e0b;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <button id="logout-btn" onclick="logout()">Sair</button>
    <div class="logoCountainer">
        <img src="assets/LogoLogin.png" alt="logoLogin" class="logoLogin">
    </div>
    <h2>Login de Administrador</h2>
    <form id="adminLoginForm">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="email@email.com"required >
        </div>
        <div class="mb-3 position-relative">
            <label for="password" class="form-label">Senha</label>
            <input type="password" class="form-control" id="password" placeholder="senha"required>
            <i class="fa-solid fa-eye eye-icon" id="toggleSenha"></i>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-custom-red">Entrar</button>
        </div>
    </form>
    <p id="error-message"></p>

    <script>
        const senhaInput = document.getElementById("password");
        const toggleSenha = document.getElementById("toggleSenha");

        toggleSenha.addEventListener("click", function () {
            if (senhaInput.type === "password") {
                senhaInput.type = "text";
                toggleSenha.classList.remove("fa-eye");
                toggleSenha.classList.add("fa-eye-slash");
            } else {
                senhaInput.type = "password";
                toggleSenha.classList.remove("fa-eye-slash");
                toggleSenha.classList.add("fa-eye");
            }
        });
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000' 
            : 'https://lsports.onrender.com';

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            // Validação dos campos
            let isValid = true;
            if (!email) {
                document.getElementById('email').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('email').classList.remove('invalid');
            }

            if (!password) {
                document.getElementById('password').classList.add('invalid');
                isValid = false;
            } else {
                document.getElementById('password').classList.remove('invalid');
            }

            if (!isValid) {
                errorMessage.textContent = 'Por favor, preencha todos os campos.';
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/admin-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();

                if (res.ok && data.isAdmin) {
                    // Armazena o token no localStorage
                    localStorage.setItem('token', data.token);
                    window.location.href = 'admin.html'; // Redireciona para a página de administração
                } else {
                    errorMessage.textContent = data.message || 'Acesso negado';
                }
            } catch (error) {
                console.error('Erro no login de administrador:', error);
                errorMessage.textContent = 'Erro no servidor. Tente novamente mais tarde.';
            }
        });

        // Função para alternar a visibilidade da senha
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const passwordType = passwordField.type === 'password' ? 'text' : 'password';
            passwordField.type = passwordType;
        }
    </script>
</body>
</html>
