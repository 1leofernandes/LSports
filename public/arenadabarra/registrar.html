<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - LSports</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="assets/barraazulicon.png"/>
    <link rel="stylesheet" href="styles/registrar.css">
</head>
<body>

    <div class="container 20px">

        <div class="logoCountainer">
            <img src="assets/barraazulicon.png" alt="lsports-icon" class="lsports-icon">
        </div>

        <h2 class="text-center">Registrar</h2>
        <form id="registerForm">
            <div class="mb-3">
                <label for="name" class="form-label">Nome</label>
                <input type="text" class="form-control" id="name" name="nome" placeholder="Nome Sobrenome" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="email@email.com" required>
            </div>
            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(62) 12345-6789 " required>
            </div>
            <div class="mb-3 position-relative">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" placeholder="senha" required>
                <i class="fa-solid fa-eye eye-icon" id="toggleSenha"></i>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-custom-red">Registrar</button>
            </div>
        </form>
        <p class="mt-3">Já tem uma conta? <a href="login.html" class="custom-link">Fazer login</a></p>
    </div>

    <script src="scripts/common.js" defer></script>
    <script src="scripts/registrar.js" defer></script>
</body>
</html>
