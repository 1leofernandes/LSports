<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Funcionário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="assets/icone.webp"/>
    <link rel="stylesheet" href="styles/registrar-funcionario.css">
</head>
<body>
    <button id="logout-btn" onclick="logout()">Sair</button>
    <div class="container mt-5">
        <h2 class="text-center">Registrar Funcionário</h2>
        <form id="registrarFuncionarioForm">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="name" placeholder="Nome Sobrenome" required>
            </div>
            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(62) 12345-6789" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="email@email.com" required>
            </div>
            <div class="mb-3 position-relative">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" placeholder="sua senha" required>
                <i class="fa-solid fa-eye eye-icon" id="toggleSenha"></i>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-custom-red">Registrar</button>
            </div>
            <div class="d-grid gap-2 mt-3">
                <button type="button" id="btnVerUsuarios" class="btn btn-outline-secondary">Ver usuários</button>
            </div>
        </form>
        <p class="mt-3 text-center"><a href="login.html" class="custom-link">Já tem uma conta? Faça login</a></p>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Modal para listar/manipular usuários -->
        <div class="modal fade" id="usuariosModal" tabindex="-1" aria-labelledby="usuariosModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="usuariosModalLabel">Usuários registrados</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <input type="search" class="form-control" id="usuariosSearch" placeholder="Pesquisar por nome ou email">
                        </div>
                        <div id="usuarios-list"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal de confirmação customizada -->
        <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Confirmação</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body" id="confirmModalBody"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="confirmCancel">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="confirmOk">Confirmar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal de mensagem (alert-like) -->
        <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Mensagem</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body" id="messageModalBody"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Ok</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="scripts/registrar-funcionario.js" defer></script>
</body>
</html>
