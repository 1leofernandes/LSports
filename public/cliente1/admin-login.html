<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" href="styles/admin-login.css" />
    <link rel="icon" href="assets/icone.webp"/>
    <title>Login de Administrador</title>
</head>
<body>
    <button id="logout-btn" onclick="logout()">Sair</button>
    <div class="logoCountainer">
        <img src="assets/LogoLogin.png" alt="logoLogin" class="logoLogin">
    </div>
    <h2>Login de Administrador</h2>
    <form id="adminLoginForm">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="email@email.com"required >
        </div>
        <div class="mb-3 position-relative">
            <label for="password" class="form-label">Senha</label>
            <input type="password" class="form-control" id="password" placeholder="senha"required>
            <i class="fa-solid fa-eye eye-icon" id="toggleSenha"></i>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-custom-red">Entrar</button>
        </div>
    </form>
    <p id="error-message"></p>

    <script src="scripts/admin-login.js" defer></script>
</body>
</html>
