<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Cantinho do Boni</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="icon" href="assets/icone.webp"/>
    <link rel="stylesheet" href="styles/agendamento.css"/>
</head>
<body>
    <header class="header">
        <button id="logout-btn" onclick="logout()" class="btn btn-sm btn-light">
            <i class="bi bi-box-arrow-right"></i> Sair
        </button>
        
        <img src="assets/lsports-icon.png" alt="Logo" class="imgheader"/>
        <h1>Agendamento de Quadras</h1>
        
        <a href="https://maps.app.goo.gl/wcYHGHWd6uQUk12f6" target="_blank" style="color: white; text-decoration: underline;">
            <span>Av. Anápolis - QD 41 - LT 15</span><br>
            <span>Parque das Amendoeiras - Goiânia</span>
        </a>
        <br>
        <div class="date-box">
            Seg a Sex: 17h - 00h | Sáb: 10h - 00h | Dom 10h - 23h
        </div>
        <div class="social-icons">
            <a href="https://wa.me/5562993881267" target="_blank" class="whatsapp-icon">
                <img src="assets/whatsapp.png" alt="WhatsApp">
            </a>
            <a href="https://www.instagram.com/ocantinhodoboni" target="_blank">
                <img src="assets/instagram.png" alt="Instagram">
            </a>
            <a href="https://wa.me/5562984894774?text=Preciso de ajuda com o agendamento, ou quero relatar um problema:" target="_blank">
                <img src="assets/ajuda.png" alt="Ajuda">
            </a>
        </div>
    </header>

    <div class="container">
        <h2 class="mb-4">Olá, <span id="nomeUsuario" class="username">Usuário</span></h2>
        
        <form id="agendamentoForm" class="needs-validation" novalidate>
            <div class="mb-4">
                <label class="form-label">Data do Agendamento</label>
                <input type="date" class="form-control" id="data" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Escolha a Quadra</label>
                <div id="quadra" class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-secondary quadra-btn" data-quadra="1">Quadra 1</button>
                    <button type="button" class="btn btn-outline-secondary quadra-btn" data-quadra="2">Quadra 2</button>
                </div>
                <input type="hidden" name="quadra" id="quadraSelecionada" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Horário de Início</label>
                <div class="time-grid" id="timeGrid"></div>
                <select class="form-control mt-2 d-none" id="horaInicio" required></select>
            </div>

            <div class="mb-4">
                <label class="form-label">Horário Final</label>
                <div class="time-grid" id="timeGridFim"></div>
                <select class="form-control mt-2 d-none" id="horaFim" required disabled>
                    <option value="">Selecione o horário de início primeiro</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Forma de Pagamento</label>
                <select class="form-control" id="paymentMethod" required>
                    <option value="">Selecione...</option>
                    <option value="cartao">Cartão</option>
                    <option value="dinheiro">Dinheiro</option>
                    <option value="pix">Pix</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-calendar-check"></i> Reservar Agora
            </button>
        </form>
    </div>

    <button id="btn-meus-agendamentos">
        <i class="bi bi-list-task"></i> Meus Agendamentos
    </button>
    
    <div id="lista-agendamentos">
        <h5 class="text-center mb-3"><i class="bi bi-calendar3"></i> Meus Agendamentos</h5>
        <div id="conteudo-agendamentos"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="scripts/common.js" defer></script>
    <script src="scripts/agendamento.js" defer></script>
</body>
</html>
